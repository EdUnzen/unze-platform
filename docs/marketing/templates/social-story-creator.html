<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px; height: 1920px; overflow: hidden;
    font-family: system-ui, sans-serif;
    background: linear-gradient(180deg, #0c3d2e 0%, #14532d 40%, #134e4a 100%);
    color: #fff; padding: 80px 64px; display: flex; flex-direction: column; justify-content: space-between;
  }
  .logo { font-size: 48px; font-weight: 900; }
  .tag { color: #6ee7b7; font-size: 20px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 24px; }
  h1 { font-size: 64px; line-height: 1.08; font-weight: 800; margin-bottom: 32px; }
  p { font-size: 30px; line-height: 1.45; color: rgba(255,255,255,0.9); }
  .cta { background: #22c55e; text-align: center; padding: 28px; border-radius: 24px; font-size: 28px; font-weight: 800; margin-top: 48px; }
  .footer { font-size: 22px; opacity: 0.75; text-align: center; }
</style>
</head>
<body>
  <div>
    <div class="logo">UNZE</div>
    <div style="margin-top:120px">
      <div class="tag">Creator Beta</div>
      <h1>Sei einer der ersten Creator auf UNZE.</h1>
      <p>Baue jetzt deine Community auf — Gruppen, Events, Services, Auszeichnungen und Zertifikate an einem Ort.</p>
      <div class="cta">Jetzt starten ?</div>
    </div>
  </div>
  <div class="footer">unze-platform.vercel.app</div>
</body>
</html>
