<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:900px;height:1800px;background:#111827;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif}
  .phone{width:390px;height:844px;border-radius:48px;background:#000;padding:14px;box-shadow:0 40px 80px rgba(0,0,0,.5)}
  .screen{width:100%;height:100%;border-radius:36px;overflow:hidden;background:linear-gradient(180deg,#0c3d2e,#14532d);color:#fff;padding:32px 24px}
  .logo{font-size:22px;font-weight:900;margin-bottom:24px}
  h1{font-size:26px;line-height:1.2;margin-bottom:12px}
  p{font-size:14px;opacity:.9;line-height:1.5}
  .cta{margin-top:24px;background:#22c55e;text-align:center;padding:14px;border-radius:16px;font-weight:700;font-size:15px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
  .chip{font-size:10px;background:rgba(255,255,255,.12);padding:6px 10px;border-radius:999px}
</style>
</head>
<body>
  <div class="phone"><div class="screen">
    <div class="logo">UNZE</div>
    <h1>Dein Netzwerk für Communities, Gruppen, Events & mehr</h1>
    <p>Communities verwalten, Auszeichnungen vergeben, Zertifikate sammeln.</p>
    <div class="chips"><span class="chip">Communities</span><span class="chip">Events</span><span class="chip">Zertifikate</span></div>
    <div class="cta">Discover öffnen</div>
  </div></div>
</body>
</html>
