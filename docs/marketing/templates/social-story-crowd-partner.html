<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px; height: 1920px; overflow: hidden;
    font-family: system-ui, sans-serif;
    background: linear-gradient(180deg, #134e4a 0%, #0f766e 50%, #0c3d2e 100%);
    color: #fff; padding: 80px 64px; display: flex; flex-direction: column; justify-content: center;
  }
  .logo { font-size: 44px; font-weight: 900; margin-bottom: 80px; }
  .tag { color: #fcd34d; font-size: 18px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 20px; }
  h1 { font-size: 58px; line-height: 1.1; font-weight: 800; margin-bottom: 28px; }
  p { font-size: 28px; line-height: 1.5; color: rgba(255,255,255,0.92); margin-bottom: 20px; }
  .box { margin-top: 40px; background: rgba(255,255,255,0.1); border-radius: 24px; padding: 32px; font-size: 26px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="logo">UNZE Crowd Partner</div>
  <div class="tag">Wachstum teilen</div>
  <h1>Empfiehl Creator.<br/>Profitiert gemeinsam.</h1>
  <p>Das Crowd-Partner-Programm belohnt Empfehlungen — wenn die Plattform wächst, wächst dein Netzwerk mit.</p>
  <div class="box">Creator werben Creator ? gemeinsames Wachstum auf UNZE.</div>
</body>
</html>
