<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:1600px;background:#0f172a;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif}
  .tablet{width:820px;height:1100px;border-radius:32px;background:#1e293b;padding:24px;box-shadow:0 30px 60px rgba(0,0,0,.45)}
  .screen{height:100%;border-radius:20px;background:#fff;padding:32px;color:#0f172a}
  h1{font-size:28px;margin-bottom:8px}
  p{color:#64748b;margin-bottom:24px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .card{border:1px solid #e2e8f0;border-radius:16px;padding:20px}
  .card h2{font-size:16px;margin-bottom:6px}
  .card span{font-size:13px;color:#64748b}
</style>
</head>
<body>
  <div class="tablet"><div class="screen">
    <h1>Discover</h1>
    <p>Communities, Gruppen, Events & Services entdecken</p>
    <div class="grid">
      <div class="card"><h2>CodeCraft Academy</h2><span>500 Mitglieder · Technologie</span></div>
      <div class="card"><h2>Lens Masters Guild</h2><span>10.000 Mitglieder · Fotografie</span></div>
      <div class="card"><h2>Mathe Meister</h2><span>2.000 Mitglieder · Bildung</span></div>
      <div class="card"><h2>Fit Squad DACH</h2><span>50 Mitglieder · Fitness</span></div>
    </div>
  </div></div>
</body>
</html>
