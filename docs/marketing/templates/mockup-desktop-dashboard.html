<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1600px;height:1000px;background:#e2e8f0;font-family:system-ui,sans-serif;padding:40px}
  .browser{background:#fff;border-radius:16px;height:100%;box-shadow:0 20px 50px rgba(0,0,0,.12);overflow:hidden;display:grid;grid-template-columns:260px 1fr}
  .nav{background:#f8fafc;border-right:1px solid #e2e8f0;padding:24px}
  .nav h2{font-size:14px;color:#64748b;margin-bottom:16px}
  .nav div{padding:10px 12px;border-radius:10px;margin-bottom:6px;font-size:14px}
  .nav .active{background:#dcfce7;color:#166534;font-weight:600}
  .main{padding:32px}
  h1{font-size:28px;margin-bottom:24px}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .card{border:1px solid #e2e8f0;border-radius:16px;padding:20px}
  .card h3{font-size:16px;margin-bottom:8px}
  .card p{font-size:13px;color:#64748b}
</style>
</head>
<body>
  <div class="browser">
    <div class="nav"><h2>Dashboard</h2><div class="active">Mitglieder</div><div>Events</div><div>Anträge</div><div>Auszeichnungen</div><div>Monetarisierung</div></div>
    <div class="main">
      <h1>Rocket League SSL Coaching</h1>
      <div class="cards">
        <div class="card"><h3>124 Mitglieder</h3><p>Aktive Community</p></div>
        <div class="card"><h3>3 offene Anträge</h3><p>Beitrittsanfragen</p></div>
        <div class="card"><h3>12 Auszeichnungen</h3><p>Vergeben & aktiv</p></div>
      </div>
    </div>
  </div>
</body>
</html>
