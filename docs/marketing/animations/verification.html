<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050508; overflow: hidden;
    }
    .mesh { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 30%, rgba(16,185,129,0.22), transparent 60%); }
    .badge {
      position: absolute; top: 200px; left: 50%; transform: translateX(-50%) scale(0.5);
      padding: 28px 48px; border-radius: 24px;
      background: linear-gradient(135deg, rgba(16,185,129,0.3), rgba(16,185,129,0.1));
      border: 2px solid rgba(16,185,129,0.5);
      font-size: 36px; font-weight: 700; color: #6ee7b7;
      opacity: 0; animation: pop 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.5s forwards;
    }
    .phone {
      position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%);
      width: 480px; height: 980px; border-radius: 60px; padding: 14px;
      background: linear-gradient(155deg, #3a3a3c, #09090b);
      box-shadow: 0 0 80px rgba(16,185,129,0.25), 0 60px 120px rgba(0,0,0,0.55);
      opacity: 0; animation: fade 1s ease 1.2s forwards;
    }
    .screen { width: 100%; height: 100%; border-radius: 48px; overflow: hidden; }
    .screen img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
    @keyframes pop { to { opacity: 1; transform: translateX(-50%) scale(1); } }
    @keyframes fade { to { opacity: 1; } }
  </style>
</head>
<body>
  <div class="mesh"></div>
  <div class="badge">Verifiziert</div>
  <div class="phone">
    <div class="screen"><img src="data:image/png;base64,{{SCREEN_PROFILE}}" alt="" /></div>
  </div>
</body>
</html>
