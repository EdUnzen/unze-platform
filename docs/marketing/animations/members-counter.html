<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050508; overflow: hidden; position: relative;
    }
    .mesh {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 70% 60% at 50% 20%, rgba(59, 130, 246, 0.2), transparent 55%);
    }
    .title {
      position: absolute; top: 160px; left: 50%; transform: translateX(-50%);
      font-size: 48px; font-weight: 700; color: #fff; letter-spacing: -0.03em;
      opacity: 0; animation: in 0.7s ease 0.2s forwards;
    }
    .stats {
      position: absolute; top: 280px; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; gap: 20px; z-index: 20;
    }
    .stat {
      padding: 20px 40px; border-radius: 20px;
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(20px); min-width: 420px; text-align: center;
      opacity: 0; transform: translateY(24px);
    }
    .stat:nth-child(1) { animation: in 0.6s ease 0.8s forwards; }
    .stat:nth-child(2) { animation: in 0.6s ease 1.3s forwards; }
    .stat:nth-child(3) { animation: in 0.6s ease 1.8s forwards; }
    .num { font-size: 52px; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; }
    .lbl { font-size: 20px; color: rgba(255,255,255,0.45); margin-top: 4px; }
    .phone {
      position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%);
      width: 460px; height: 940px; border-radius: 58px; padding: 13px;
      background: linear-gradient(155deg, #3a3a3c, #09090b);
      box-shadow: 0 60px 120px rgba(0,0,0,0.55);
      opacity: 0; animation: in 1s ease 2.2s forwards;
    }
    .screen { width: 100%; height: 100%; border-radius: 48px; overflow: hidden; }
    .screen img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
    @keyframes in {
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
  </style>
</head>
<body>
  <div class="mesh"></div>
  <div class="title">Mitglieder verwalten</div>
  <div class="stats">
    <div class="stat"><div class="num" id="c1">0</div><div class="lbl">Aktive Mitglieder</div></div>
    <div class="stat"><div class="num" id="c2">0</div><div class="lbl">Neue diese Woche</div></div>
    <div class="stat"><div class="num" id="c3">0</div><div class="lbl">Verifiziert</div></div>
  </div>
  <div class="phone">
    <div class="screen"><img src="data:image/png;base64,{{SCREEN_MEMBERS}}" alt="" /></div>
  </div>
  <script>
    function count(id, target, delay, dur) {
      const el = document.getElementById(id);
      setTimeout(() => {
        const start = performance.now();
        function tick(now) {
          const t = Math.min(1, (now - start) / dur);
          el.textContent = Math.floor((1 - Math.pow(1 - t, 3)) * target).toLocaleString("de-DE");
          if (t < 1) requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      }, delay);
    }
    count("c1", 12400, 900, 1800);
    count("c2", 847, 1400, 1400);
    count("c3", 3200, 1900, 1600);
  </script>
</body>
</html>
