<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1920px; background: #050508; font-family: -apple-system, sans-serif; overflow: hidden; }
    .mesh { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 25%, rgba(6,182,212,0.2), transparent 60%); }
    .nodes { position: absolute; inset: 0; }
    .node {
      position: absolute; width: 80px; height: 80px; border-radius: 50%;
      background: rgba(6,182,212,0.2); border: 2px solid rgba(6,182,212,0.5);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: #67e8f9;
      opacity: 0; animation: nodeIn 0.6s ease forwards;
    }
    .node:nth-child(1) { top: 200px; left: 200px; animation-delay: 0.5s; }
    .node:nth-child(2) { top: 280px; right: 180px; animation-delay: 1s; }
    .node:nth-child(3) { top: 400px; left: 340px; animation-delay: 1.5s; }
    .line { position: absolute; height: 2px; background: rgba(6,182,212,0.4); transform-origin: left; scale: 0 1; animation: lineGrow 0.8s ease forwards; }
    .phone {
      position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%);
      width: 460px; height: 940px; border-radius: 58px; padding: 13px;
      background: linear-gradient(155deg, #3a3a3c, #09090b);
      box-shadow: 0 60px 120px rgba(0,0,0,0.55);
      opacity: 0; animation: fade 1s ease 2s forwards;
    }
    .screen { width: 100%; height: 100%; border-radius: 48px; overflow: hidden; }
    .screen img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
    @keyframes nodeIn { to { opacity: 1; transform: scale(1); } }
    @keyframes fade { to { opacity: 1; } }
  </style>
</head>
<body>
  <div class="mesh"></div>
  <div class="nodes">
    <div class="node">Creator</div>
    <div class="node">Partner</div>
    <div class="node">Netz</div>
  </div>
  <div class="phone">
    <div class="screen"><img src="data:image/png;base64,{{SCREEN_CROWD}}" alt="" /></div>
  </div>
</body>
</html>
