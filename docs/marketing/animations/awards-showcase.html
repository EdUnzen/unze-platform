<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1920px; background: #050508; font-family: -apple-system, sans-serif; overflow: hidden; }
    .mesh { position: absolute; inset: 0; background: radial-gradient(ellipse at 40% 20%, rgba(244,63,94,0.18), transparent 55%); }
    .award {
      position: absolute; left: 50%; transform: translateX(-50%);
      padding: 20px 36px; border-radius: 20px;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14);
      backdrop-filter: blur(20px); color: #fff; font-size: 26px; font-weight: 650;
      opacity: 0;
    }
    .award:nth-child(2) { top: 180px; animation: slide 0.7s ease 0.4s forwards; }
    .award:nth-child(3) { top: 280px; animation: slide 0.7s ease 1s forwards; }
    .award:nth-child(4) { top: 380px; animation: slide 0.7s ease 1.6s forwards; }
    .phone {
      position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%);
      width: 460px; height: 940px; border-radius: 58px; padding: 13px;
      background: linear-gradient(155deg, #3a3a3c, #09090b);
      box-shadow: 0 60px 120px rgba(0,0,0,0.55);
      opacity: 0; animation: fade 1s ease 2.2s forwards;
    }
    .screen { width: 100%; height: 100%; border-radius: 48px; overflow: hidden; }
    .screen img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
    @keyframes slide { from { opacity: 0; transform: translateX(-50%) translateX(-40px); } to { opacity: 1; transform: translateX(-50%) translateX(0); } }
    @keyframes fade { to { opacity: 1; } }
  </style>
</head>
<body>
  <div class="mesh"></div>
  <div class="award">SSL Champion</div>
  <div class="award">Turnier MVP</div>
  <div class="award">Community Builder</div>
  <div class="phone">
    <div class="screen"><img src="data:image/png;base64,{{SCREEN_AUSZEICHNUNGEN}}" alt="" /></div>
  </div>
</body>
</html>
