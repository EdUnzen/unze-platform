<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050508;
      overflow: hidden;
      position: relative;
    }
    .mesh {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 30% 15%, rgba(16, 185, 129, 0.2) 0%, transparent 55%),
        radial-gradient(ellipse 60% 50% at 80% 70%, rgba(99, 102, 241, 0.15) 0%, transparent 50%);
    }
    .counter-wrap {
      position: absolute;
      top: 140px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 20;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.3s forwards;
    }
    .counter {
      font-size: 96px;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: #fff;
      font-variant-numeric: tabular-nums;
    }
    .label {
      margin-top: 12px;
      font-size: 28px;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 500;
    }
    .phone {
      position: absolute;
      left: 50%;
      bottom: 80px;
      transform: translateX(-50%) scale(0.92);
      width: 460px;
      height: 940px;
      background: linear-gradient(155deg, #3a3a3c, #09090b);
      border-radius: 58px;
      padding: 13px;
      box-shadow: 0 60px 120px rgba(0, 0, 0, 0.55);
      opacity: 0;
      animation: phoneIn 1s cubic-bezier(0.22, 1, 0.36, 1) 0.6s forwards;
    }
    .screen {
      width: 100%;
      height: 100%;
      border-radius: 48px;
      overflow: hidden;
    }
    .screen img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
    .chips {
      position: absolute;
      bottom: 1060px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 20;
    }
    .chip {
      padding: 12px 22px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      color: #f5f5f7;
      font-size: 20px;
      font-weight: 600;
      opacity: 0;
      transform: translateY(20px);
    }
    .chip:nth-child(1) { animation: chipIn 0.6s ease 2s forwards; }
    .chip:nth-child(2) { animation: chipIn 0.6s ease 2.4s forwards; }
    .chip:nth-child(3) { animation: chipIn 0.6s ease 2.8s forwards; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateX(-50%) translateY(30px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    @keyframes phoneIn {
      from { opacity: 0; transform: translateX(-50%) scale(0.88) translateY(40px); }
      to { opacity: 1; transform: translateX(-50%) scale(1) translateY(0); }
    }
    @keyframes chipIn {
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="mesh"></div>
  <div class="counter-wrap">
    <div class="counter" id="count">0</div>
    <div class="label">Mitglieder wachsen mit UNZE</div>
  </div>
  <div class="chips">
    <div class="chip">12.400+ Gaming</div>
    <div class="chip">8.400 Foto</div>
    <div class="chip">4.900 Bildung</div>
  </div>
  <div class="phone">
    <div class="screen">
      <img src="data:image/png;base64,{{SCREEN_DISCOVER}}" alt="" />
    </div>
  </div>
  <script>
    const target = 12400;
    const el = document.getElementById("count");
    const start = performance.now();
    const dur = 2200;
    function tick(now) {
      const t = Math.min(1, (now - start) / dur);
      const eased = 1 - Math.pow(1 - t, 3);
      el.textContent = Math.floor(eased * target).toLocaleString("de-DE");
      if (t < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  </script>
</body>
</html>
