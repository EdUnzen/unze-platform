<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1920px; background: #050508; font-family: -apple-system, sans-serif; overflow: hidden; }
    .mesh { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 30%, rgba(245,158,11,0.2), transparent 60%); }
    .revenue {
      position: absolute; top: 180px; left: 50%; transform: translateX(-50%);
      font-size: 88px; font-weight: 800; color: #fff; letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
    }
    .sub { position: absolute; top: 300px; left: 50%; transform: translateX(-50%); font-size: 26px; color: rgba(255,255,255,0.45); }
    .phone {
      position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%);
      width: 460px; height: 940px; border-radius: 58px; padding: 13px;
      background: linear-gradient(155deg, #3a3a3c, #09090b);
      box-shadow: 0 60px 120px rgba(0,0,0,0.55);
    }
    .screen { width: 100%; height: 100%; border-radius: 48px; overflow: hidden; }
    .screen img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
  </style>
</head>
<body>
  <div class="mesh"></div>
  <div class="revenue" id="rev">0 &#8364;</div>
  <div class="sub">Monatliche Einnahmen</div>
  <div class="phone">
    <div class="screen"><img src="data:image/png;base64,{{SCREEN_MONETIZATION}}" alt="" /></div>
  </div>
  <script>
    const el = document.getElementById("rev");
    const target = 4280;
    const start = performance.now();
    function tick(now) {
      const t = Math.min(1, (now - start) / 2500);
      const v = Math.floor((1 - Math.pow(1 - t, 3)) * target);
      el.textContent = v.toLocaleString("de-DE") + " \u20AC";
      if (t < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  </script>
</body>
</html>
