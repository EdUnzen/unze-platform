<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1920px; background: #050508; font-family: -apple-system, sans-serif; overflow: hidden; }
    .pulse {
      position: absolute; top: 50%; left: 50%; width: 600px; height: 600px;
      transform: translate(-50%, -50%);
      border-radius: 50%; border: 2px solid rgba(139, 92, 246, 0.4);
      animation: pulse 2s ease infinite;
    }
    .pulse:nth-child(2) { animation-delay: 0.6s; }
    .phone {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 480px; height: 980px; border-radius: 60px; padding: 14px;
      background: linear-gradient(155deg, #3a3a3c, #09090b);
      box-shadow: 0 0 60px rgba(139, 92, 246, 0.3), 0 40px 80px rgba(0,0,0,0.5);
      z-index: 5;
    }
    .screen { width: 100%; height: 100%; border-radius: 48px; overflow: hidden; }
    .screen img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
    .tag {
      position: absolute; bottom: 200px; left: 50%; transform: translateX(-50%);
      padding: 16px 32px; border-radius: 999px;
      background: rgba(139, 92, 246, 0.25); border: 1px solid rgba(139, 92, 246, 0.5);
      color: #e9d5ff; font-size: 24px; font-weight: 650; z-index: 10;
      opacity: 0; animation: fade 0.6s ease 1.5s forwards;
    }
    @keyframes pulse { 0% { transform: translate(-50%,-50%) scale(0.6); opacity: 0.8; } 100% { transform: translate(-50%,-50%) scale(1.2); opacity: 0; } }
    @keyframes fade { to { opacity: 1; } }
  </style>
</head>
<body>
  <div class="pulse"></div>
  <div class="pulse"></div>
  <div class="phone">
    <div class="screen"><img src="data:image/png;base64,{{SCREEN_EVENTS}}" alt="" /></div>
  </div>
  <div class="tag">Live Events</div>
</body>
</html>
