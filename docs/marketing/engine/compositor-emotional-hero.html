<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <style>
    :root { --accent-soft: {{ACCENT_SOFT}}; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #050508;
      overflow: hidden;
      position: relative;
    }
    .mesh {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 20%, var(--accent-soft) 0%, transparent 55%),
        linear-gradient(180deg, #0a0a10, #050508);
    }
    .headline {
      position: absolute;
      top: 200px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      font-size: 120px;
      font-weight: 800;
      letter-spacing: -0.05em;
      color: #fff;
      text-shadow: 0 0 80px var(--accent-soft);
    }
    .subline {
      position: absolute;
      top: 360px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      font-size: 36px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.55);
    }
    .phone-stage {
      position: absolute;
      left: 50%;
      bottom: 48px;
      transform: translateX(-50%);
    }
    .phone {
      width: 480px;
      height: 984px;
      background: linear-gradient(155deg, #3a3a3c, #09090b);
      border-radius: 62px;
      padding: 14px;
      box-shadow: 0 60px 120px rgba(0, 0, 0, 0.55);
    }
    .island {
      position: absolute;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      width: 136px;
      height: 38px;
      background: #000;
      border-radius: 22px;
      z-index: 5;
    }
    .screen {
      width: 100%;
      height: 100%;
      border-radius: 50px;
      overflow: hidden;
    }
    .screen img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
    }
  </style>
</head>
<body>
  <div class="mesh"></div>
  <div class="headline">{{HEADLINE}}</div>
  <div class="subline">{{SUBLINE}}</div>
  <div class="phone-stage">
    <div class="phone">
      <div class="island"></div>
      <div class="screen">
        <img src="data:image/png;base64,{{SCREEN_B64}}" alt="" />
      </div>
    </div>
  </div>
</body>
</html>
