<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1920px;
      height: 1080px;
      background: radial-gradient(ellipse 90% 120% at 20% 50%, #f5f5f7 0%, #e3e3e8 50%, #c8c8d0 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      align-items: center;
      overflow: hidden;
    }
    .copy {
      padding: 80px 72px 80px 120px;
    }
    .eyebrow {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #6e6e73;
      margin-bottom: 24px;
    }
    .headline {
      font-size: 64px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #1d1d1f;
      line-height: 1.08;
      max-width: 640px;
    }
    .subline {
      font-size: 28px;
      color: #6e6e73;
      margin-top: 28px;
      line-height: 1.45;
      max-width: 560px;
    }
    .cta {
      display: inline-block;
      margin-top: 40px;
      padding: 16px 32px;
      background: #1d1d1f;
      color: #fff;
      border-radius: 980px;
      font-size: 20px;
      font-weight: 600;
    }
    .visual {
      display: flex;
      justify-content: center;
      align-items: center;
      padding-right: 80px;
      filter: drop-shadow(0 40px 80px rgba(0, 0, 0, 0.18));
    }
    .browser {
      width: 920px;
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.06), 0 24px 48px rgba(0, 0, 0, 0.12);
    }
    .chrome {
      height: 44px;
      background: linear-gradient(#ebebeb, #e3e3e3);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 8px;
      border-bottom: 1px solid #d1d1d6;
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot.r { background: #ff5f57; }
    .dot.y { background: #febc2e; }
    .dot.g { background: #28c840; }
    .url {
      flex: 1;
      margin-left: 12px;
      height: 26px;
      background: #fff;
      border-radius: 6px;
      font-size: 13px;
      color: #6e6e73;
      display: flex;
      align-items: center;
      padding: 0 12px;
    }
    .browser img {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="copy">
    <div class="eyebrow">Creator Beta</div>
    <div class="headline">{{HEADLINE}}</div>
    <div class="subline">{{SUBLINE}}</div>
    <div class="cta">unze-platform.vercel.app</div>
  </div>
  <div class="visual">
    <div class="browser">
      <div class="chrome">
        <div class="dot r"></div>
        <div class="dot y"></div>
        <div class="dot g"></div>
        <div class="url">unze-platform.vercel.app</div>
      </div>
      <img src="data:image/png;base64,{{SCREEN_B64}}" alt="" />
    </div>
  </div>
</body>
</html>
