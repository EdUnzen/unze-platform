<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: {{WIDTH}}px;
      height: {{HEIGHT}}px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #050508;
      overflow: hidden;
      position: relative;
    }
    .mesh {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 80% at 50% 50%, rgba(16, 185, 129, 0.12) 0%, transparent 60%),
        linear-gradient(180deg, #0a0a10, #050508);
    }
    .browser {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: calc(100% - 120px);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 40px 80px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.08);
    }
    .chrome {
      height: 32px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 6px;
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; }
    .dot.r { background: #ff5f57; }
    .dot.y { background: #febc2e; }
    .dot.g { background: #28c840; }
    .browser img { width: 100%; display: block; }
    .badge {
      position: absolute;
      bottom: 32px;
      right: 48px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>
  <div class="mesh"></div>
  <div class="browser">
    <div class="chrome">
      <div class="dot r"></div>
      <div class="dot y"></div>
      <div class="dot g"></div>
    </div>
    <img src="data:image/png;base64,{{SCREEN_B64}}" alt="" />
  </div>
  <div class="badge">UNZE</div>
</body>
</html>
