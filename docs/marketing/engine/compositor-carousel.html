<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1080px;
      background: radial-gradient(ellipse at 50% 30%, #fafafa 0%, #e8e8ed 55%, #c7c7cc 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: grid;
      grid-template-rows: auto 1fr auto;
      align-items: center;
      overflow: hidden;
      position: relative;
    }
    .caption {
      text-align: center;
      padding: 56px 64px 24px;
    }
    .headline {
      font-size: 44px;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: #1d1d1f;
      line-height: 1.15;
    }
    .subline {
      font-size: 24px;
      color: #6e6e73;
      margin-top: 12px;
    }
    .phone-wrap {
      display: flex;
      justify-content: center;
      filter: drop-shadow(0 32px 64px rgba(0, 0, 0, 0.2));
    }
    .phone {
      width: 340px;
      height: 698px;
      background: linear-gradient(145deg, #2c2c2e, #0a0a0a);
      border-radius: 50px;
      padding: 11px;
      position: relative;
    }
    .island {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: 108px;
      height: 32px;
      background: #000;
      border-radius: 18px;
      z-index: 10;
    }
    .screen {
      width: 100%;
      height: 100%;
      border-radius: 40px;
      overflow: hidden;
    }
    .screen img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
    }
    .footer {
      text-align: center;
      padding-bottom: 40px;
      font-size: 20px;
      font-weight: 600;
      color: #86868b;
      letter-spacing: 0.12em;
    }
    .step {
      position: absolute;
      top: 40px;
      right: 48px;
      font-size: 22px;
      color: #86868b;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="step">{{STEP}}</div>
  <div class="caption">
    <div class="headline">{{HEADLINE}}</div>
    <div class="subline">{{SUBLINE}}</div>
  </div>
  <div class="phone-wrap">
    <div class="phone">
      <div class="island"></div>
      <div class="screen">
        <img src="data:image/png;base64,{{SCREEN_B64}}" alt="" />
      </div>
    </div>
  </div>
  <div class="footer">UNZE</div>
</body>
</html>
