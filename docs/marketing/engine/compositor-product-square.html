<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <style>
    :root { --accent-soft: {{ACCENT_SOFT}}; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1080px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #07070a;
      overflow: hidden;
      position: relative;
    }
    .mesh {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 60% at 30% 20%, var(--accent-soft) 0%, transparent 55%),
        linear-gradient(145deg, #0c0c12, #050508);
    }
    .glass-msg {
      position: absolute;
      top: 48px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      padding: 18px 32px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(20px);
      font-size: 28px;
      font-weight: 650;
      color: #f5f5f7;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }
    .phone-stage {
      position: absolute;
      left: 50%;
      bottom: 40px;
      transform: translateX(-50%);
    }
    .glow {
      position: absolute;
      width: 420px;
      height: 420px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, var(--accent-soft) 0%, transparent 70%);
      filter: blur(36px);
    }
    .phone {
      position: relative;
      width: 400px;
      height: 820px;
      background: linear-gradient(155deg, #3a3a3c, #09090b);
      border-radius: 54px;
      padding: 12px;
      box-shadow: 0 48px 96px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.08);
    }
    .island {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: 118px;
      height: 34px;
      background: #000;
      border-radius: 20px;
      z-index: 5;
    }
    .screen {
      width: 100%;
      height: 100%;
      border-radius: 44px;
      overflow: hidden;
    }
    .screen img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
    }
  </style>
</head>
<body>
  <div class="mesh"></div>
  <div class="glass-msg">{{MESSAGE}}</div>
  <div class="phone-stage">
    <div class="glow"></div>
    <div class="phone">
      <div class="island"></div>
      <div class="screen">
        <img src="data:image/png;base64,{{SCREEN_B64}}" alt="" />
      </div>
    </div>
  </div>
</body>
</html>
