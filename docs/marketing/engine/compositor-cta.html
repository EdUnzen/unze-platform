<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <style>
    :root { --accent-soft: {{ACCENT_SOFT}}; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #050508;
      overflow: hidden;
      position: relative;
    }
    .mesh {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 90% 70% at 50% 25%, var(--accent-soft) 0%, transparent 60%),
        linear-gradient(180deg, #0a0a10, #050508);
    }
    .cta {
      position: absolute;
      top: 120px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      max-width: 920px;
      padding: 26px 52px;
      border-radius: 999px;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -0.025em;
      text-align: center;
      box-shadow: 0 16px 48px rgba(16, 185, 129, 0.4);
      line-height: 1.2;
    }
    .phone-stage {
      position: absolute;
      left: 50%;
      bottom: 48px;
      transform: translateX(-50%);
    }
    .phone {
      width: 500px;
      height: 1024px;
      background: linear-gradient(155deg, #3a3a3c, #09090b);
      border-radius: 64px;
      padding: 14px;
      box-shadow: 0 64px 128px rgba(0, 0, 0, 0.6), 0 0 100px var(--accent-soft);
    }
    .island {
      position: absolute;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      width: 140px;
      height: 38px;
      background: #000;
      border-radius: 22px;
      z-index: 5;
    }
    .screen {
      width: 100%;
      height: 100%;
      border-radius: 52px;
      overflow: hidden;
    }
    .screen img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
    }
    .logo {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>
<body>
  <div class="mesh"></div>
  <div class="cta">{{HEADLINE}}</div>
  <div class="phone-stage">
    <div class="phone">
      <div class="island"></div>
      <div class="screen">
        <img src="data:image/png;base64,{{SCREEN_B64}}" alt="" />
      </div>
    </div>
  </div>
  <div class="logo">UNZE</div>
</body>
</html>
