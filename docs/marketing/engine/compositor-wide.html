<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: {{WIDTH}}px;
      height: {{HEIGHT}}px;
      background: linear-gradient(135deg, #f5f5f7 0%, #e8e8ed 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 48px;
      gap: 48px;
    }
    .browser {
      flex: 1;
      max-height: 100%;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(0, 0, 0, 0.05);
    }
    .chrome {
      height: 36px;
      background: #ececec;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 6px;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot.r { background: #ff5f57; }
    .dot.y { background: #febc2e; }
    .dot.g { background: #28c840; }
    .browser img { width: 100%; height: auto; display: block; }
    .badge {
      position: absolute;
      bottom: 32px;
      right: 48px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #1d1d1f;
    }
    body { position: relative; }
  </style>
</head>
<body>
  <div class="browser">
    <div class="chrome">
      <div class="dot r"></div>
      <div class="dot y"></div>
      <div class="dot g"></div>
    </div>
    <img src="data:image/png;base64,{{SCREEN_B64}}" alt="" />
  </div>
  <div class="badge">UNZE</div>
</body>
</html>
