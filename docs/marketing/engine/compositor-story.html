<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: radial-gradient(ellipse 120% 80% at 50% 0%, #fafafa 0%, #ececf1 42%, #d1d1d6 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      position: relative;
    }
    .step {
      position: absolute;
      top: 56px;
      right: 72px;
      font-size: 26px;
      font-weight: 600;
      color: #86868b;
      letter-spacing: 0.04em;
    }
    .caption {
      text-align: center;
      padding: 120px 72px 40px;
      flex-shrink: 0;
      max-height: 26%;
    }
    .headline {
      font-size: 54px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #1d1d1f;
      line-height: 1.12;
    }
    .subline {
      font-size: 30px;
      font-weight: 400;
      color: #6e6e73;
      margin-top: 18px;
      line-height: 1.35;
    }
    .phone-wrap {
      flex: 1;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 8px;
      filter: drop-shadow(0 48px 96px rgba(0, 0, 0, 0.22)) drop-shadow(0 12px 24px rgba(0, 0, 0, 0.12));
    }
    .phone {
      width: 400px;
      height: 820px;
      background: linear-gradient(145deg, #2c2c2e 0%, #1c1c1e 50%, #0a0a0a 100%);
      border-radius: 58px;
      padding: 13px;
      position: relative;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }
    .island {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 128px;
      height: 37px;
      background: #000;
      border-radius: 22px;
      z-index: 10;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.04);
    }
    .screen {
      width: 100%;
      height: 100%;
      border-radius: 46px;
      overflow: hidden;
      background: #000;
    }
    .screen img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }
    .brand {
      position: absolute;
      bottom: 56px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 24px;
      font-weight: 600;
      color: #86868b;
      letter-spacing: 0.14em;
    }
    .brand span { color: #1d1d1f; }
  </style>
</head>
<body>
  <div class="step">{{STEP}}</div>
  <div class="caption">
    <div class="headline">{{HEADLINE}}</div>
    <div class="subline">{{SUBLINE}}</div>
  </div>
  <div class="phone-wrap">
    <div class="phone">
      <div class="island"></div>
      <div class="screen">
        <img src="data:image/png;base64,{{SCREEN_B64}}" alt="" />
      </div>
    </div>
  </div>
  <div class="brand"><span>UNZE</span></div>
</body>
</html>
