<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <style>
    :root { --accent-soft: {{ACCENT_SOFT}}; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #050508;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .orb1, .orb2 {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
    }
    .orb1 {
      width: 600px;
      height: 600px;
      top: -120px;
      left: -100px;
      background: var(--accent-soft);
      opacity: 0.55;
    }
    .orb2 {
      width: 500px;
      height: 500px;
      bottom: -80px;
      right: -80px;
      background: rgba(99, 102, 241, 0.25);
    }
    .headline {
      position: relative;
      z-index: 2;
      max-width: 920px;
      padding: 0 64px;
      font-size: {{HEADLINE_SIZE}}px;
      font-weight: 750;
      letter-spacing: -0.04em;
      line-height: 1.05;
      text-align: center;
      color: #f5f5f7;
      text-wrap: balance;
    }
    .subline {
      position: relative;
      z-index: 2;
      margin-top: 36px;
      font-size: 42px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.55);
      letter-spacing: -0.01em;
    }
    .logo {
      position: absolute;
      bottom: 80px;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>
<body>
  <div class="orb1"></div>
  <div class="orb2"></div>
  <div class="headline">{{HEADLINE}}</div>
  <div class="subline">{{SUBLINE}}</div>
  <div class="logo">UNZE</div>
</body>
</html>
